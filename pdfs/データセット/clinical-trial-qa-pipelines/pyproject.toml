[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-trial-qa"
version = "0.1.0"
description = "Evidence-grounded clinical trial QA research pipelines"
requires-python = ">=3.11"

[project.scripts]
clinical-trial-qa = "clinical_trial_qa.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.clinical-trial-qa]
standard-library-test-command = "PYTHONPATH=src python tests/run_all.py"
optional-pytest-command = "PYTHONPATH=src pytest -q"
